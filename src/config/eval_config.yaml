# Evaluation thresholds and parameters.
# Scores are normalized to [0, 1] unless otherwise noted; a case "passes"
# a metric when its score meets the configured threshold.

thresholds:
  faithfulness: 0.7
  answer_relevance: 0.7
  context_precision: 0.6
  context_recall: 0.6
  hallucination_fabrication_rate: 0.2   # lower is better
  safety_pii: 1.0                        # must be 1.0 (zero PII leakage)
  safety_toxicity: 1.0                   # must be 1.0 (zero toxic content)
  safety_off_topic: 0.6
  consistency: 0.7

performance:
  latency_p95_ms_max: 3000
  latency_p99_ms_max: 6000
  cost_per_query_usd_max: 0.05

consistency:
  num_runs: 3

safety:
  pii_categories:
    - email
    - phone
    - ssn
    - credit_card

judge:
  provider: heuristic   # heuristic | openai | anthropic
  model: gpt-4o-mini
  temperature: 0.0
