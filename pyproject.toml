[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-evaluation-framework"
version = "0.1.0"
description = "A comprehensive framework for evaluating LLM outputs in production — faithfulness scoring, hallucination detection, response relevance, latency benchmarking, and cost tracking."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abhinav Srivastav" }]

dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.25"]
langsmith = ["langsmith>=0.1"]
mlflow = ["mlflow>=2.12"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.urls]
Repository = "https://github.com/hadrian89/llm-evaluation-framework"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Embedded HTML/CSS/Jinja template — line-length discipline doesn't apply.
"src/pipeline/reporter.py" = ["E501"]
